# 맥·윈도우 설치 파일을 뽑아서 GitHub Release 에 올린다.
#
# 맥에서 윈도우 exe 를, 윈도우에서 맥 dmg 를 만들 수 없기 때문에
# 각 OS 러너에서 따로 빌드하고, 결과물만 같은 릴리스에 모은다.
#
# 실행 방법
#   Actions 탭 → "build" → Run workflow → 태그 입력 (기본 v0.1.0)
#   또는 v0.1.0 같은 태그를 푸시
#
# 필요한 Secret (Settings → Secrets and variables → Actions)
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   TAURI_SIGNING_PRIVATE_KEY   ← 자동 업데이트 서명용
# 앞의 둘이 없으면 목 데이터로 도는 앱이 나온다. 친구한테 줄 빌드에는 반드시.
# 마지막 것이 없으면 빌드는 되지만 자동 업데이트가 안 붙는다.
#
# 자동 업데이트가 동작하려면 레포가 공개여야 한다. 앱이 릴리스 파일을
# 받으러 갈 때 로그인을 할 수 없어서, 비공개면 404 만 받는다.

name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그"
        required: true
        default: v0.1.0
  push:
    tags:
      - "v*"

# 릴리스를 만들려면 쓰기 권한이 필요하다
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            label: windows
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # 러스트 의존성 캐시. 첫 빌드는 10~15분, 이후는 2~3분.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # 두 잡이 같은 태그로 올리면 먼저 끝난 쪽이 릴리스를 만들고
      # 나중 쪽은 거기에 파일만 붙인다.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 업데이트 파일에 서명한다. 앱은 서명이 맞는 것만 설치한다
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}
          # 앱이 보고 판단할 latest.json 을 릴리스에 같이 올린다
          includeUpdaterJson: true
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: run study ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          # ⚠ true 로 두면 안 된다. 업데이터가 보는 releases/latest 는
          # 미리보기 릴리스를 건너뛰기 때문에 업데이트가 영영 안 잡힌다
          prerelease: false
          releaseBody: |
            맥은 `.dmg`, 윈도우는 `-setup.exe` 를 받으세요.

            **서명이 없어서 경고가 뜹니다.** 악성이라는 뜻이 아니라
            유료 개발자 등록을 안 했다는 뜻이에요.

            - 윈도우: "Windows의 PC 보호" → **추가 정보** → **실행**
            - 맥: 시스템 설정 → 개인정보 보호 및 보안 → **확인 없이 열기**

            윈도우에는 알림 끄기(집중 모드)가 없습니다. 나머지는 같아요.

            > 한 번 설치하고 나면 다음부터는 앱이 알아서 알려줍니다.
            > 여기 다시 올 필요 없어요.

      # 릴리스가 실패해도 결과물은 건지도록 따로 한 번 더 올린다
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-study-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.msi
