[package]
name = "run-study"
version = "0.1.0"
description = "같이 있진 않지만 같이 있는 느낌"
edition = "2021"
rust-version = "1.77"

[lib]
name = "run_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: 릴리스 빌드에서도 창 우클릭 → 검사가 열린다.
# 사용자 컴퓨터에서 난 오류를 볼 유일한 방법이라 켜둔다.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
